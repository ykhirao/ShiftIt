# Xcode プロジェクトの定義。ShiftItNeo.xcodeproj はここから XcodeGen で生成する（リポジトリには入れない）。
#   brew install xcodegen && xcodegen generate
name: ShiftItNeo

options:
  bundleIdPrefix: io.github.ykhirao
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  ShortcutRecorder:
    url: https://github.com/Kentzo/ShortcutRecorder
    exactVersion: 3.4.0

settings:
  base:
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_TREAT_IMPLICIT_FUNCTION_DECLARATIONS_AS_ERRORS: YES
    GCC_TREAT_INCOMPATIBLE_POINTER_TYPE_WARNINGS_AS_ERRORS: YES
  configs:
    Release:
      GCC_PREPROCESSOR_DEFINITIONS: ["NDEBUG=1", "$(inherited)"]

targets:
  ShiftItNeo:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - ShiftItNeoTests
    sources:
      - path: ShiftIt
        excludes:
          - "FMT/Readme.md"
          - "ShiftIt-Info.plist"
          - "GTM/GTMLogger.m"
      # 外から持ち込んだ Google Toolbox for Mac のコードなので、手を入れずに MRC のままコンパイルする
      - path: ShiftIt/GTM/GTMLogger.m
        group: ShiftIt/GTM
        compilerFlags: ["-fno-objc-arc"]
    dependencies:
      - sdk: Carbon.framework
      - sdk: Cocoa.framework
      - sdk: ServiceManagement.framework
      - package: ShortcutRecorder
    settings:
      base:
        PRODUCT_NAME: ShiftItNeo
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ykhirao.ShiftItNeo
        INFOPLIST_FILE: ShiftIt/ShiftIt-Info.plist
        GCC_PREFIX_HEADER: ShiftIt/ShiftIt_Prefix.pch
        GCC_PRECOMPILE_PREFIX_HEADER: YES
        COMBINE_HIDPI_IMAGES: YES
        # 仮の署名（ad-hoc）。Apple Silicon では署名のないアプリは起動できない
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""

  # 計算まわりの単体テスト。アプリを起動しない（アクセシビリティ許可のダイアログで止まらないように）ので、
  # テスト対象のソースを直接テストバンドルに入れている
  ShiftItNeoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: ShiftIt/SIAdjacentRectangles.m
        group: Tests/Sources
      - path: ShiftIt/FMTGeometry.m
        group: Tests/Sources
      - path: ShiftIt/FMT/FMTNSArray+Functional.m
        group: Tests/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ykhirao.ShiftItNeoTests
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)/ShiftIt", "$(PROJECT_DIR)/ShiftIt/FMT", "$(PROJECT_DIR)/ShiftIt/GTM"]
        GCC_PREFIX_HEADER: ShiftIt/ShiftIt_Prefix.pch
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
