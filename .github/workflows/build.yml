name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Xcode のバージョン
        run: xcodebuild -version

      - name: Xcode プロジェクトを生成
        run: |
          brew install xcodegen
          xcodegen generate

      - name: ビルド
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ShiftItNeo.xcodeproj \
            -scheme ShiftItNeo \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            build 2>&1 | tee build/xcodebuild.log

      - name: テスト
        run: |
          set -o pipefail
          xcodebuild \
            -project ShiftItNeo.xcodeproj \
            -scheme ShiftItNeo \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            test 2>&1 | tee build/xcodebuild-test.log

      # 自己署名証明書で署名し直す。ビルドが変わっても同じ証明書で署名されていれば、
      # macOS はアクセシビリティの許可を引き継ぐ。証明書が登録されていなければ仮の署名（ad-hoc）のまま。
      - name: 自己署名証明書で署名する
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          app=build/DerivedData/Build/Products/Release/ShiftItNeo.app
          if [ -z "$SIGNING_CERT_P12" ]; then
            echo "SIGNING_CERT_P12 が未登録なので、仮の署名（ad-hoc）のままにする"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # 自己署名なので、コード署名用として信頼する設定を入れないと codesign が証明書を見つけられない
          security find-certificate -c "ShiftIt Self-Signed" -p "$keychain" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/cert.pem"
          security find-identity -p codesigning "$keychain"
          codesign --force --sign "ShiftIt Self-Signed" --keychain "$keychain" "$app"
          codesign --verify --strict "$app"
          codesign -d -r- "$app"

      - name: アプリを zip にまとめる
        run: |
          app=build/DerivedData/Build/Products/Release/ShiftItNeo.app
          lipo -info "$app/Contents/MacOS/ShiftItNeo"
          codesign -dv "$app" 2>&1 | grep -E "Authority|Signature"
          ditto -c -k --keepParent "$app" build/ShiftItNeo.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ShiftItNeo
          path: build/ShiftItNeo.zip

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xcodebuild-log
          path: build/xcodebuild*.log
